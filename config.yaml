      - "Database Engineer"
      - "Data Analyst"

  seniority:
    preferred:  ["junior", "entry-level", "new grad", "0-1 yıl", "0-2 years"]
    acceptable: ["mid-level", "2-3 yıl", "1-3 years"]
    rejected:   ["senior", "staff", "principal", "manager", "lead", "head of"]

  work_preference: ["hybrid", "remote", "on-site"]

