redis:
  stream_raw:      "jobs:raw"
  stream_filtered: "jobs:filtered"
  stream_failed:   "jobs:failed"
  consumer_group:  "job-hunter"
  consumer_name:   "orchestrator-1"
  dedup_set_key:   "jobs:seen"
  dedup_ttl_days:  30

server:
  metrics_port: 9091
