scoring:
  telegram_threshold_primary:   8.0
  telegram_threshold_secondary: 8.0
  save_threshold:               0.0 # Tüm puanlanan ilanlar DB'ye kaydedilir

sources:
  kariyer_net:
    enabled: false

  linkedin_rss:
    enabled: false

  indeed:
    enabled: false

  ats:
    enabled: true
    greenhouse:
      - name: "Dream Games"
        token: "dreamgames"
      - name: "Adyen"
        token: "adyen"
      - name: "Grafana Labs"
        token: "grafanalabs"
      - name: "Cloudflare"
        token: "cloudflare"
      - name: "Datadog"
        token: "datadog"
      - name: "Elastic"
        token: "elastic"
      - name: "Celonis"
        token: "celonis"
      - name: "N26"
        token: "n26"
      - name: "HelloFresh"
        token: "hellofresh"
      - name: "Wolt"
        token: "wolt"
      - name: "Deliveroo"
        token: "deliveroo"
      - name: "Collibra"
        token: "collibra"
      - name: "Guardsquare"
        token: "guardsquare"
      - name: "Contentful"
        token: "contentful"
      - name: "GetYourGuide"
        token: "getyourguide"
      - name: "Monzo"
        token: "monzo"
      - name: "Canonical"
        token: "canonical"
    # Lever: Trendyol/Commencis/Iyzico/Peak Games slug'ları 404 döndürdüğü için kaldırıldı (Ekim 2026 doğrulaması).
    # Geçerli bir slug bulunursa şu formatta eklenebilir:  lever: [{name: "X", slug: "x"}]
    smartrecruiters:
      - name: "Frequentis"
        company_id: "frequentis"
      - name: "Delivery Hero"
        company_id: "DeliveryHero"
      - name: "Wise"
        company_id: "Wise"
      - name: "CERN"
        company_id: "CERN"

  eurocontrol:
    enabled: false # Aday EUROCONTROL traineeship kabulü aldığı için devre dışı bırakıldı

  techcareer:
    enabled: true

  coderspace:
    enabled: true

  arbeitnow:
    enabled: true

  jobspy:
    enabled: true
    poll_interval_minutes: 240   # LinkedIn ban riskini azaltmak için seyrek tarama
    max_age_days: 3
    results_per_keyword: 20
    location: "Istanbul, Turkey"
    locations:
      - "Istanbul, Turkey"
      - "Brussels, Belgium"
      - "Amsterdam, Netherlands"
      - "Berlin, Germany"
      - "Munich, Germany"
    # Anahtar kelimeler bilinçli olarak az tutuldu: LinkedIn/Indeed benzer başlıklar için aynı ilanları döndürür.
    # Giriş seviyesi + ML/Data kelimeleri eklendi (aday Python + ML ders geçmişine sahip).
    keywords:
      # ── Backend / Software ────────────────────
      - "backend engineer"
      - "software engineer"
      - "go developer"
      - "java spring boot developer"
      - "python developer"
      # ── Cloud / DevOps ────────────────────────
      - "devops engineer"
      - "cloud engineer"
      - "platform engineer"
      - "site reliability engineer"
      # ── Giriş seviyesi sinyalleri ─────────────
      - "graduate software engineer"
      - "junior software developer"
      - "new grad software engineer"
      - "entry level software engineer"
      - "trainee software engineer"
      # ── Data / ML (junior) ────────────────────
      - "data engineer"
      - "junior data analyst"
      - "junior data scientist"
      - "junior machine learning engineer"
      # ── Türkçe (yalnızca TR lokasyonunda aranır) ─
      - "yeni mezun yazılım mühendisi"
      - "yazılım mühendisi"
      - "genç yetenek"
      - "mt programı"
redis:
  stream_raw:      "jobs:raw"
  stream_filtered: "jobs:filtered"
  stream_failed:   "jobs:failed"
  consumer_group:  "job-hunter"
  consumer_name:   "orchestrator-1"
  dedup_set_key:   "jobs:seen"
  dedup_ttl_days:  30

server:
  metrics_port: 9091
  dashboard_port: 8080

gemini:
  model: "gemini-flash-lite-latest"
  max_tokens: 1000
  rate_limit_rpm: 30

worker:
  pool_size: 3

notifications:
  telegram_enabled: true