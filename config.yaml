scoring:
  telegram_threshold_primary:   7.5
  telegram_threshold_secondary: 8.0
  save_threshold:               0.0 # Tüm puanlanan ilanlar DB'ye kaydedilir

sources:
  kariyer_net:
    enabled: false

  linkedin_rss:
    enabled: false

  indeed:
    enabled: false

  ats:
    enabled: true
    greenhouse:
      - name: "Dream Games"
        token: "dreamgames"
      - name: "Adyen"
        token: "adyen"
    lever:
      - name: "Trendyol"
        slug: "trendyol"
      - name: "Commencis"
        slug: "commencis"
      - name: "Iyzico"
        slug: "iyzico"
      - name: "Peak Games"
        slug: "peakgames"
    smartrecruiters:
      - name: "Frequentis"
        company_id: "frequentis"
      - name: "Delivery Hero"
        company_id: "DeliveryHero"

  eurocontrol:
    enabled: true

  techcareer:
    enabled: true

  arbeitnow:
    enabled: true

  jobspy:
    enabled: true
    poll_interval_minutes: 30
    max_age_days: 7
    results_per_keyword: 20
    location: "Istanbul, Turkey"
    keywords:
      # ── Backend — Go/Java ─────────────────────
      - "backend developer"
      - "backend engineer"
      - "software engineer"
      - "software developer"
      - "go developer"
      - "golang developer"
      - "java developer"
      - "java spring boot developer"
      - "distributed systems"

      # ── Backend — Python ──────────────────────
      - "python developer"
      - "python backend developer"
      - "junior python developer"

      # ── Cloud / DevOps ────────────────────────
      - "cloud engineer"
      - "devops engineer"
      - "platform engineer"
      - "site reliability engineer"
      - "sre"
      - "aws engineer"
      - "infrastructure engineer"

      # ── Türkçe — Yeni Mezun & MT Programları ────
      - "yazılım mühendisi"
      - "yeni mezun yazılım"
      - "yeni mezun mühendis"
      - "genç yetenek"
      - "mt programı"
      - "yazılım uzman yardımcısı"
      - "backend geliştirici"

      # ── English — Junior & Entry Signals ────────
      - "graduate software engineer"
      - "trainee software engineer"
      - "associate software engineer"
      - "junior software developer"
      - "junior backend engineer"
      - "junior devops engineer"
      - "junior cloud engineer"

      # ── Data (secondary track) ────────────────
      - "data engineer"
      - "data platform engineer"
      - "analytics engineer"
      - "data analyst"
      - "junior data analyst"

redis:
  stream_raw:      "jobs:raw"
  stream_filtered: "jobs:filtered"
  stream_failed:   "jobs:failed"
  consumer_group:  "job-hunter"
  consumer_name:   "orchestrator-1"
  dedup_set_key:   "jobs:seen"
  dedup_ttl_days:  30

server:
  metrics_port: 9091
  dashboard_port: 8080

gemini:
  model: "qwen/qwen3.8-27b"
  max_tokens: 1000
  rate_limit_rpm: 5

worker:
  pool_size: 1

notifications:
  telegram_enabled: true