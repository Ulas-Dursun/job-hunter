# ─────────────────────────────────────────────────────────────────
# Job Hunter — Aday ve Sistem Konfigürasyonu
# Bu dosya hem Go orchestrator hem Python scraper tarafından okunur.
# Gizli bilgiler (API key, şifre) buraya yazılmaz — .env'e gider.
# ─────────────────────────────────────────────────────────────────

candidate:
  name: "Ulaş Dursun"
  location: "Istanbul"
  status: "new_grad"
  graduation_year: 2026

  skills:
    languages:  ["Go", "Java", "Python", "Rust", "SQL", "C++ (Working Knowledge)"]
    frameworks: ["Spring Boot"]
    databases:  ["PostgreSQL", "MongoDB", "Redis"]
    os:         ["Linux (Bash/Shell Scripting)"]
    infra:      ["Docker", "Docker Compose", "CI/CD (GitHub Actions)", "Prometheus", "Grafana"]
    cloud:      ["AWS (Certified AI Practitioner)"]
    concepts:   ["REST API", "JWT", "Concurrency", "Worker Pool",
                 "Distributed Systems", "TCP/UDP", "Microservices", "Testcontainers"]

  target_roles:
