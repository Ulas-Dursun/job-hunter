# ─────────────────────────────────────────────────────────────────
# Job Hunter — Candidate & System Configuration Template
# Shared by both the Go Orchestrator and the Python Scraper service.
#
# 💡 TIP FOR PRIVATE PROFILES:
# Copy this file to `config.local.yaml` (which is git-ignored) and put
# your real resume details there. Both Go and Python automatically load
# `config.local.yaml` when present!
# ─────────────────────────────────────────────────────────────────

candidate:
  name: "Your Name"
  location: "Istanbul"
  status: "new_grad"
  graduation_year: 2026
  education: "B.Sc. in Software / Computer Engineering (2021 – 2026) | Coursework: Distributed Systems, Machine Learning, Database Systems"
  mobility_note: "Open to Istanbul/Turkey, Brussels, Amsterdam, Berlin, Munich, Copenhagen, London, Zurich, and EU/Global Remote"
  spoken_languages: "English (Fluent C1/C2), Turkish (Native)"
  links: "linkedin.com/in/your-handle • github.com/your-username"

  # Used by the AI Tailor Engine to adapt your CV summary to Backend/Cloud vs. Data/ML roles
  summary_variants:
    - "Backend & Cloud Variant: Software Engineer focused on backend systems and cloud-native development using Go, Java, Python, PostgreSQL, Redis, and Docker."
    - "Data & Distributed Systems Variant: Software Engineer experienced in data-intensive pipelines, event-driven processing, and analytical systems using Python, SQL, PostgreSQL, and Docker."

  # Factual work / internship bullets used for scoring, cover letters, and STAR interview prep
  experience:
    - "Junior Software Engineer | Example Tech (2025): Built RESTful microservices and background workers in Go and Python, improving API response times and service reliability."
    - "Software Engineering Intern | Acme Cloud Corp. (2024): Contributed to backend data validation modules, REST API endpoints, and automated CI/CD test suites."

  # Key engineering projects with concrete metrics (never hallucinated by the AI Tailor Engine)
  projects:
    - "Distributed Task Queue Service (Go, Redis, PostgreSQL, Docker): Built a concurrent worker pool with retry logic and Prometheus metrics for asynchronous background jobs."
    - "E-Commerce Backend API (Java, Spring Boot, PostgreSQL, Docker): Designed a JWT-authenticated REST API with role-based access control and integration tests."
    - "Real-Time Analytics Dashboard (Python, React, SQL): Created a data ingestion pipeline and web dashboard for visualizing application telemetry."

  skills:
    languages:  ["Go", "Java", "Python", "Rust", "SQL", "C++"]
    frameworks: ["Spring Boot", "React"]
    databases:  ["PostgreSQL", "MongoDB", "Redis", "Firebase"]
    os:         ["Linux", "Bash"]
    infra:      ["Docker", "Docker Compose", "CI/CD", "GitHub Actions", "Prometheus", "Grafana", "ESP32"]
    cloud:      ["AWS", "EC2", "S3", "IAM", "VPC", "AWS Certified AI Practitioner"]
    concepts:   ["REST API", "JWT", "Concurrency", "Worker Pool",
                 "Distributed Systems", "TCP/UDP", "Microservices", "Testcontainers",
                 "Machine Learning"]

  target_roles:
